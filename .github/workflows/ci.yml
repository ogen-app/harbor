name: CI

# Run on every PR and on pushes to main (post-merge gate).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo to build, test, and lint.
permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No git ops after checkout — don't persist GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # Pins to the version in the `go` directive of go.mod (1.26.1).
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./cmd/... ./src/...

  ui:
    name: UI lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No git ops after checkout — don't persist GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Build
        # NEXT_OUTPUT=export mirrors `make ui` — the static export that gets
        # embedded into the Go binary.
        run: NEXT_OUTPUT=export npm run build
        working-directory: ui

  proto:
    name: Proto stubs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pin to the versions in the generated headers so regeneration is
      # byte-identical. tenants.v1 + secrets.v1 come from buf.build/ogen-app/proto.
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated code is up to date
        run: |
          make proto
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "::error::gen/ is out of date — run 'make proto' and commit the result"
            git diff -- gen/
            exit 1
          fi

name: CI

# Run on every PR and on pushes to main (post-merge gate).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR. Each push to main gets a group of its
# own, so no main run is cancelled or replaced while waiting, and every green
# merge publishes its image; the publish job orders them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read the repo, except publish, which also pushes
# the image.
permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          # No git ops after checkout — don't persist GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # Pins to the version in the `go` directive of go.mod (1.26.1).
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./cmd/... ./src/...

  ui:
    name: UI lint & build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          # No git ops after checkout — don't persist GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Build
        # NEXT_OUTPUT=export mirrors `make ui` — the static export that gets
        # embedded into the Go binary.
        run: NEXT_OUTPUT=export npm run build
        working-directory: ui

  proto:
    name: Proto stubs in sync
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pin to the versions in the generated headers so regeneration is
      # byte-identical. tenants.v1 + secrets.v1 come from buf.build/ogen-app/proto.
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated code is up to date
        run: |
          make proto
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "::error::gen/ is out of date — run 'make proto' and commit the result"
            git diff -- gen/
            exit 1
          fi

  # Every green main push publishes ghcr.io/ogen-app/harbor:<build>, where build
  # is the commit count on main, then asks ogen-release to bump harbor to it.
  publish:
    name: Build and push Docker image
    needs: [go, ui, proto]
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Back-to-back merges publish one at a time, so build numbers reach the
    # registry and ogen-release in order. queue: max keeps every waiting run;
    # by default a newer one would cancel the run already waiting.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Blacksmith keeps the layer cache on a sticky disk keyed by cache-key.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: Dockerfile

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/ogen-app/harbor:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/harbor

      # The release App's token, limited to ogen-release, sends the bump. Both
      # steps are best effort: a missing App or ogen-release must not fail main.
      - name: Release App token
        id: release-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ogen-app
          repositories: ogen-release
          permission-contents: write

      - name: Dispatch bump to ogen-release
        if: steps.release-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=harbor' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
